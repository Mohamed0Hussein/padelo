name: Build Android

# Builds the release app on GitHub's Linux runners instead of EAS Build.
# - Manually: Actions › Build Android › Run workflow (choose APK or AAB)
# - On a version tag (git tag v1.0.1 && git push --tags): builds an APK and attaches it to a GitHub Release
#
# Signing uses these repository secrets (Settings › Secrets and variables › Actions);
# without them the build is signed with the debug key:
#   ANDROID_KEYSTORE_BASE64       the upload keystore (.jks), base64-encoded
#   PADELO_UPLOAD_STORE_PASSWORD
#   PADELO_UPLOAD_KEY_ALIAS
#   PADELO_UPLOAD_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      format:
        description: Output
        type: choice
        options: [apk, aab]
        default: apk
  push:
    tags: ['v*']

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release on tags
    env:
      FORMAT: ${{ inputs.format || 'apk' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # caches Gradle downloads and build outputs between runs
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PADELO_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PADELO_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PADELO_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the build is signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          mkdir -p ~/.gradle
          {
            echo "PADELO_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "PADELO_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "PADELO_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "PADELO_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties

      - name: Build
        run: npm run build:android -- ${{ env.FORMAT == 'aab' && '--aab' || '' }}

      - name: Name the output
        id: out
        run: |
          src=android/app/build/outputs/apk/release/app-release.apk
          [ "$FORMAT" = aab ] && src=android/app/build/outputs/bundle/release/app-release.aab
          name="padelo-${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD).$FORMAT"
          cp "$src" "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.file }}
          path: ${{ steps.out.outputs.file }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.out.outputs.file }}" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" ~/.gradle/gradle.properties
