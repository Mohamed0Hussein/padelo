<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Padel – Courtside scoreboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#2DD4BF}a:hover{color:#5EEAD4}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;overflow:hidden;width:1em;height:1em}
.ms.f{font-variation-settings:'FILL' 1}
*{scrollbar-width:thin;scrollbar-color:rgba(128,140,160,0.45) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(128,140,160,0.45);border-radius:3px}
*::-webkit-scrollbar-button{display:none;width:0;height:0}
*::-webkit-scrollbar-corner{background:transparent}
</style>
</helmet>
<div style="{{st.rootL}}">
<div aria-hidden="true" style="{{st.blobA}}"></div>
<div aria-hidden="true" style="{{st.blobB}}"></div>
<div aria-hidden="true" style="{{st.blobC}}"></div>
<div style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-height: 0">
<header style="display: flex; align-items: center; gap: 4px; padding: 8px 12px 4px 8px">
  <a href="{{L.LiveScore}}" aria-label="Back to portrait scoring" style="{{st.iconBtn}}"><span class="ms" aria-hidden="true">arrow_back</span></a>
  <span style="flex: 1; font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; {{st.muted}}">Court 2 · QF3 · {{rules}}</span>
  <span style="{{st.chip}} height: 32px; border-radius: 16px"><span class="ms" aria-hidden="true" style="font-size: 18px; {{st.prim}}">brightness_high</span>Screen stays on</span>
  <button onClick="{{toggleVol}}" aria-pressed="{{volPressed}}" aria-label="Score with volume buttons" style="{{volStyle}}"><span class="ms" aria-hidden="true" style="font-size: 18px">{{volIcon}}</span>Volume keys</button>
  <button onClick="{{toggleLock}}" aria-pressed="{{lockPressed}}" style="{{lockStyle}}"><span class="ms" aria-hidden="true" style="font-size: 18px">{{lockIcon}}</span>{{lockLabel}}</button>
  <button onClick="{{undo}}" aria-label="Undo last point" style="{{st.iconBtnG}}"><span class="ms" aria-hidden="true">undo</span></button>
  <button onClick="{{toggleTheme}}" aria-label="Switch light or dark theme" style="{{st.iconBtn}}"><span class="ms" aria-hidden="true">{{themeIcon}}</span></button>
</header>

<div style="flex: 1; min-height: 0; display: flex; gap: 12px; padding: 4px 16px 16px 16px">
  <sc-for list="{{pads}}" as="p" hint-placeholder-count="2">
    <button onClick="{{p.add}}" aria-label="{{p.aria}}" style="{{p.style}}">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 500"><span class="ms f" aria-hidden="true" style="{{p.serveStyle}}">sports_tennis</span>{{p.name}}</span>
      <span style="font-family: 'Roboto Mono', monospace; font-size: 132px; font-weight: 600; line-height: 1">{{p.point}}</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: 0.8"><span class="ms" aria-hidden="true" style="font-size: 16px">{{p.volIcon}}</span>{{p.hint}}</span>
    </button>
  </sc-for>
</div>

<div style="position: absolute; left: 50%; top: 64px; transform: translateX(-50%); width: 216px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none">
  <div style="{{st.cardS}} width: 100%; padding: 8px 12px; border-radius: 20px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 4px; height: 30px">
        <span style="flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.short}}</span>
        <sc-for list="{{r.cells}}" as="cl" hint-placeholder-count="3"><span style="{{cl.style}}">{{cl.v}}</span></sc-for>
      </div>
    </sc-for>
  </div>
  <span role="status" style="{{bannerStyle}}"><span class="ms" aria-hidden="true" style="font-size: 16px">{{banner.icon}}</span>{{banner.text}}</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":844,"height":390}}'>
var PAL = {
  dark: {
    bg: '#070B16', blobA: '#0D9488', blobB: '#4F46E5', blobC: '#B45309',
    glass: 'rgba(255,255,255,0.07)', glassStrong: 'rgba(255,255,255,0.13)', stroke: 'rgba(255,255,255,0.16)',
    text: '#EEF2F8', muted: '#AAB4C5', primary: '#5EEAD4', onPrimary: '#00382F',
    primarySoft: 'rgba(94,234,212,0.18)', glow: 'rgba(45,212,191,0.35)', live: '#FCA5A5',
    win: '#86EFAC', loss: '#FCA5A5', scrim: 'rgba(7,11,22,0.35)'
  },
  light: {
    bg: '#E8EEF6', blobA: '#5EEAD4', blobB: '#A5B4FC', blobC: '#FCD34D',
    glass: 'rgba(255,255,255,0.52)', glassStrong: 'rgba(255,255,255,0.78)', stroke: 'rgba(255,255,255,0.9)',
    text: '#0B1324', muted: '#46546A', primary: '#0F766E', onPrimary: '#FFFFFF',
    primarySoft: 'rgba(15,118,110,0.13)', glow: 'rgba(15,118,110,0.28)', live: '#B42318',
    win: '#067647', loss: '#B42318', scrim: 'rgba(255,255,255,0.3)'
  }
};
function theme(self) {
  var mode = self.state.mode || self.props.theme || 'dark';
  var c = PAL[mode];
  var blur = 'backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);';
  var glass = 'background:' + c.glass + ';' + blur + 'border:1px solid ' + c.stroke + ';box-sizing:border-box;';
  var glassS = 'background:' + c.glassStrong + ';' + blur + 'border:1px solid ' + c.stroke + ';box-sizing:border-box;';
  var lightPrefix = self.props.theme === 'light' ? 'Light' : '';
  var link = function (n) { return lightPrefix + n + '.dc.html'; };
  var st = {
    root: 'position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;font-family:Roboto,system-ui,sans-serif;color:' + c.text + ';background:' + c.bg + ';',
    rootL: 'position:relative;width:844px;height:390px;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;font-family:Roboto,system-ui,sans-serif;color:' + c.text + ';background:' + c.bg + ';',
    blobA: 'position:absolute;width:380px;height:380px;border-radius:50%;top:-140px;left:-150px;background:' + c.blobA + ';opacity:0.55;filter:blur(70px);',
    blobB: 'position:absolute;width:360px;height:360px;border-radius:50%;bottom:60px;right:-190px;background:' + c.blobB + ';opacity:0.55;filter:blur(80px);',
    blobC: 'position:absolute;width:200px;height:200px;border-radius:50%;top:380px;left:-60px;background:' + c.blobC + ';opacity:0.22;filter:blur(70px);',
    glass: glass, glassS: glassS,
    card: glass + 'border-radius:24px;',
    cardS: glassS + 'border-radius:24px;',
    bar: 'display:flex;align-items:center;gap:4px;padding:12px 8px 8px 8px;',
    title: 'flex:1;margin:0;font-size:22px;font-weight:400;min-width:0;',
    iconBtn: 'width:48px;height:48px;flex:none;border-radius:24px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:' + c.text + ';cursor:pointer;text-decoration:none;padding:0;',
    iconBtnG: glass + 'width:48px;height:48px;flex:none;border-radius:24px;display:flex;align-items:center;justify-content:center;color:' + c.text + ';cursor:pointer;text-decoration:none;padding:0;',
    filled: 'display:flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px;border-radius:28px;border:none;background:' + c.primary + ';color:' + c.onPrimary + ';font-family:inherit;font-size:16px;font-weight:500;text-decoration:none;cursor:pointer;box-shadow:0 10px 28px ' + c.glow + ';box-sizing:border-box;',
    tonal: glassS + 'display:flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 20px;border-radius:28px;color:' + c.text + ';font-family:inherit;font-size:16px;font-weight:500;text-decoration:none;cursor:pointer;',
    label: 'margin:0;font-size:14px;font-weight:500;color:' + c.muted + ';letter-spacing:0.01em;',
    muted: 'color:' + c.muted + ';',
    prim: 'color:' + c.primary + ';',
    mono: "font-family:'Roboto Mono',monospace;",
    chip: glass + 'display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:' + c.text + ';',
    chipOn: 'display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;box-sizing:border-box;background:' + c.primarySoft + ';border:1px solid ' + c.primary + ';color:' + c.text + ';',
    badgeLive: 'display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:' + c.live + ';',
    dotLive: 'width:8px;height:8px;border-radius:4px;background:' + c.live + ';box-shadow:0 0 10px ' + c.live + ';',
    divider: 'height:1px;background:' + c.stroke + ';',
    field: glassS + 'display:flex;flex-direction:column;gap:2px;padding:8px 16px;border-radius:16px;font-size:12px;color:' + c.muted + ';',
    input: 'border:none;outline-offset:4px;background:transparent;padding:0;height:24px;font-family:inherit;font-size:16px;color:' + c.text + ';',
    nav: glassS + 'display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 12px 12px 12px;border-radius:32px;padding:10px 4px;',
    navItem: 'display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;font-size:12px;font-weight:500;color:' + c.muted + ';',
    navItemOn: 'display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;font-size:12px;font-weight:700;color:' + c.text + ';',
    pill: 'display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px;',
    pillOn: 'display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px;background:' + c.primarySoft + ';color:' + c.primary + ';',
    track: 'height:4px;border-radius:2px;background:' + c.glassStrong + ';overflow:hidden;',
    trackFill: 'height:4px;border-radius:2px;background:' + c.primary + ';'
  };
  st.segWrap = function (n) { return glass + 'display:grid;grid-template-columns:repeat(' + n + ',minmax(0,1fr));border-radius:20px;overflow:hidden;'; };
  st.seg = function (on, first) {
    return 'display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 6px;border:none;' + (first ? '' : 'border-left:1px solid ' + c.stroke + ';') +
      'font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;' + (on ? 'background:' + c.primarySoft + ';color:' + c.primary + ';' : 'background:transparent;color:' + c.text + ';');
  };
  return {
    mode: mode, c: c, st: st, link: link,
    base: {
      st: st, c: c,
      toggleTheme: function () { self.setState({ mode: mode === 'dark' ? 'light' : 'dark' }); },
      themeIcon: mode === 'dark' ? 'light_mode' : 'dark_mode',
      L: {
        Main: link('Main'), NewMatch: link('NewMatch'), LiveScore: link('LiveScore'),
        TournamentCreate: link('TournamentCreate'), Tournament: link('Tournament'),
        Bracket: link('Bracket'), TournamentResults: link('TournamentResults'),
        Welcome: link('Welcome'), Settings: link('Settings'), Courtside: link('Courtside'), ResultCard: link('ResultCard'),
        PlayerProfile: link('PlayerProfile'), HeadToHead: link('HeadToHead'), Americano: link('Americano'), Courts: link('Courts'),
        RankingRules: link('RankingRules'), ShareLive: link('ShareLive')
      }
    }
  };
}
function segs(self, t, key, list) {
  return list.map(function (o, i) {
    var on = self.state[key] === o.v;
    return {
      label: o.label, on: on, pressed: on ? 'true' : 'false',
      pick: function () { var s = {}; s[key] = o.v; self.setState(s); },
      style: t.st.seg(on, i === 0)
    };
  });
}
function sw(t, on) {
  var c = t.c;
  return {
    on: on ? 'true' : 'false',
    track: 'position:relative;flex:none;width:52px;height:32px;border-radius:16px;cursor:pointer;padding:0;box-sizing:border-box;border:2px solid ' + (on ? c.primary + ';background:' + c.primary : c.muted + ';background:transparent'),
    knob: 'position:absolute;border-radius:50%;' + (on ? 'top:2px;left:22px;width:24px;height:24px;background:' + c.onPrimary : 'top:6px;left:6px;width:16px;height:16px;background:' + c.muted)
  };
}

// ---- Padel scoring engine (shared by LiveScore and Courtside) ----
var PT = ['0', '15', '30', '40', 'Ad'];
function engineInit(rules, preset) {
  var s = {
    rules: rules || { bestOf: 3, games: 6, deuce: 'golden', superTb: true, tiebreak: true },
    sets: [], g: [0, 0], p: [0, 0], tb: false, stb: false, server: 0, winner: -1, dc: 0, ends: false, log: [], hist: []
  };
  return Object.assign(s, preset || {});
}
function engineSnap(s) {
  return JSON.stringify({ sets: s.sets, g: s.g, p: s.p, tb: s.tb, stb: s.stb, server: s.server, winner: s.winner, dc: s.dc, ends: s.ends, log: s.log });
}
function engineLabel(s, i) { return (s.tb || s.stb) ? String(s.p[i]) : PT[s.p[i]]; }
function enginePoint(s, t, TEAMS) {
  if (s.winner >= 0) return null;
  var o = 1 - t, R = s.rules;
  var snap = engineSnap(s);
  var sets = s.sets.slice(), g = s.g.slice(), p = s.p.slice();
  var tb = s.tb, stb = s.stb, server = s.server, winner = -1, dc = s.dc, ends = false;
  var gameWon = false, setWon = false, entry = '';
  if (stb || tb) {
    p[t]++;
    var target = stb ? 10 : 7;
    if (p[t] >= target && p[t] - p[o] >= 2) {
      if (stb) { sets.push({ s: p.slice(), w: t, stb: true }); setWon = true; }
      else { g[t]++; gameWon = true; setWon = true; }
    }
    if ((p[0] + p[1]) % 2 === 1) server = 1 - server;
    if (!setWon && (p[0] + p[1]) % 6 === 0) ends = true;
    entry = (stb ? 'Super tiebreak ' : 'Tiebreak ') + p[0] + '–' + p[1];
  } else {
    var deciding = p[t] === 3 && p[o] === 3 && (R.deuce === 'golden' || (R.deuce === 'star' && dc >= 3));
    if (deciding || (p[t] === 3 && p[o] < 3) || p[t] === 4) gameWon = true;
    else if (p[t] === 3 && p[o] === 4) { p[o] = 3; dc++; entry = 'Back to deuce'; }
    else { p[t]++; if (p[0] === 3 && p[1] === 3) { dc++; entry = 'Deuce'; } }
    if (gameWon) {
      g[t]++; server = 1 - server; dc = 0;
      entry = (deciding ? (R.deuce === 'star' ? 'Star point' : 'Golden point') + ' · game ' : 'Game ') + TEAMS[t];
      if (g[t] >= R.games && g[t] - g[o] >= 2) setWon = true;
      else if ((g[0] + g[1]) % 2 === 1) ends = true;
    } else if (!entry) {
      entry = PT[p[0]] + '–' + PT[p[1]];
    }
  }
  if (gameWon || setWon) p = [0, 0];
  var need = (R.bestOf + 1) / 2;
  if (setWon) {
    var last = stb ? null : g.slice();
    if (last) { sets.push({ s: last, w: t }); if ((last[0] + last[1]) % 2 === 1) ends = true; }
    entry = 'Set ' + TEAMS[t] + ' · ' + sets[sets.length - 1].s.join('–');
    g = [0, 0]; tb = false; stb = false;
    var won = sets.filter(function (x) { return x.w === t; }).length;
    if (won === need) { winner = t; entry = 'Match ' + TEAMS[t]; ends = false; }
    else if (R.superTb && R.bestOf > 1 && sets.length === R.bestOf - 1) stb = true;
  } else if (gameWon && R.tiebreak && g[0] === R.games && g[1] === R.games) {
    tb = true; entry += ' · tiebreak';
  }
  var log = [{ text: entry, who: TEAMS[t] }].concat(s.log).slice(0, 40);
  return { sets: sets, g: g, p: p, tb: tb, stb: stb, server: server, winner: winner, dc: dc, ends: ends, log: log, hist: s.hist.concat([snap]) };
}
function engineUndo(s) {
  if (!s.hist.length) return null;
  var prev = JSON.parse(s.hist[s.hist.length - 1]);
  prev.hist = s.hist.slice(0, -1);
  return prev;
}
function engineBanner(s, TEAMS) {
  var R = s.rules;
  if (s.winner >= 0) return { text: 'Match over', icon: 'flag', hot: false };
  if (s.ends) return { text: 'Change ends', icon: 'swap_horiz', hot: true };
  if (s.stb) return { text: 'Super tiebreak · first to 10', icon: 'bolt', hot: true };
  if (s.tb) return { text: 'Tiebreak · first to 7', icon: 'bolt', hot: true };
  if (s.p[0] === 3 && s.p[1] === 3) {
    if (R.deuce === 'golden') return { text: 'Golden point · next point wins', icon: 'star', hot: true };
    if (R.deuce === 'star' && s.dc >= 3) return { text: 'Star point · next point wins', icon: 'star', hot: true };
    if (R.deuce === 'star') return { text: 'Deuce ' + s.dc + ' of 3 · star point on the 3rd', icon: 'balance', hot: true };
    return { text: 'Deuce · win two points in a row', icon: 'balance', hot: true };
  }
  if (s.p[0] === 4 || s.p[1] === 4) return { text: 'Advantage ' + TEAMS[s.p[0] === 4 ? 0 : 1], icon: 'trending_up', hot: true };
  return { text: TEAMS[s.server] + ' serving', icon: 'sports_tennis', hot: false };
}
function rulesLine(R) {
  var d = { golden: 'golden point', adv: 'advantage', star: 'star point' }[R.deuce];
  return (R.bestOf === 1 ? '1 set' : 'Best of ' + R.bestOf) + ' · sets to ' + R.games + ' · ' + d + (R.bestOf > 1 ? (R.superTb ? ' · super tiebreak' : ' · full final set') : '');
}

var TEAMS = ['Youssef & Ali', 'Ziad & Amr'];
var SHORT = ['YOU/ALI', 'ZIA/AMR'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = Object.assign({ mode: null, locked: false, vol: true }, engineInit(null, { sets: [{ s: [6, 4], w: 0 }], g: [2, 3], p: [2, 1], server: 0 }));
  }
  renderVals() {
    var t = theme(this), c = t.c, s = this.state, self = this;
    var playing = s.winner < 0;
    var cell = "width:26px;text-align:center;font-family:'Roboto Mono',monospace;font-size:14px;";
    var rows = SHORT.map(function (nm, i) {
      var cells = s.sets.map(function (x) { return { v: String(x.s[i]), style: cell + (x.w === i ? 'font-weight:600;' : 'color:' + c.muted + ';') }; });
      if (playing) cells.push({ v: String(s.stb ? s.p[i] : s.g[i]), style: cell + 'font-weight:600;border-radius:6px;color:' + c.primary + ';background:' + c.primarySoft + ';' });
      return { short: nm, cells: cells };
    });
    var banner = engineBanner(s, TEAMS);
    var pads = TEAMS.map(function (name, i) {
      var base = 'flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:0 0 22px 0;border-radius:32px;font-family:inherit;box-sizing:border-box;' + (s.locked ? 'cursor:not-allowed;opacity:0.55;' : 'cursor:pointer;');
      return {
        name: name, point: engineLabel(s, i), aria: s.locked ? 'Scoring locked' : 'Point to ' + name,
        volIcon: s.vol ? (i === 0 ? 'volume_up' : 'volume_down') : 'touch_app',
        hint: s.locked ? 'Locked' : (s.vol ? (i === 0 ? 'Tap or volume up' : 'Tap or volume down') : 'Tap for point'),
        serveStyle: 'font-size:18px;width:18px;height:18px;color:' + c.primary + ';opacity:' + (s.server === i && playing ? '1' : '0'),
        add: function () { if (self.state.locked) return; var n = enginePoint(self.state, i, TEAMS); if (n) self.setState(n); },
        style: base + (i === 0
          ? 'border:1px solid ' + c.primary + ';background:' + c.primarySoft + ';color:' + c.text + ';backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);'
          : t.st.glassS + 'color:' + c.text + ';')
      };
    });
    return Object.assign({}, t.base, {
      rules: rulesLine(s.rules), rows: rows, pads: pads, banner: banner,
      bannerStyle: (banner.hot ? t.st.chipOn : t.st.chipS || t.st.chip) + 'background:' + (banner.hot ? c.primarySoft : c.glassStrong) + ';height:32px;border-radius:16px;padding:0 12px;font-size:12px;white-space:nowrap;' + (banner.hot ? 'color:' + c.primary + ';' : ''),
      lockPressed: s.locked ? 'true' : 'false',
      lockIcon: s.locked ? 'lock' : 'lock_open',
      lockLabel: s.locked ? 'Unlock' : 'Lock',
      lockStyle: (s.locked ? t.st.chipOn : t.st.chip) + 'height:40px;border-radius:20px;cursor:pointer;font-family:inherit;',
      volPressed: s.vol ? 'true' : 'false', volIcon: s.vol ? 'volume_up' : 'volume_off',
      volStyle: (s.vol ? t.st.chipOn : t.st.chip) + 'height:40px;border-radius:20px;cursor:pointer;font-family:inherit;',
      toggleVol: function () { self.setState({ vol: !self.state.vol }); },
      toggleLock: function () { self.setState({ locked: !s.locked }); },
      undo: function () { var u = engineUndo(self.state); if (u) self.setState(u); }
    });
  }
}

</script>
</body>
</html>
