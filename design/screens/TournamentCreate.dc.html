<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Padel – Create tournament</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#2DD4BF}a:hover{color:#5EEAD4}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;overflow:hidden;width:1em;height:1em}
.ms.f{font-variation-settings:'FILL' 1}
*{scrollbar-width:thin;scrollbar-color:rgba(128,140,160,0.45) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(128,140,160,0.45);border-radius:3px}
*::-webkit-scrollbar-button{display:none;width:0;height:0}
*::-webkit-scrollbar-corner{background:transparent}
</style>
</helmet>
<div style="{{st.root}}">
<div aria-hidden="true" style="{{st.blobA}}"></div>
<div aria-hidden="true" style="{{st.blobB}}"></div>
<div aria-hidden="true" style="{{st.blobC}}"></div>
<div style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-height: 0">
<header style="{{st.bar}}">
  <a href="{{L.Main}}" aria-label="Close" style="{{st.iconBtn}}"><span class="ms" aria-hidden="true">close</span></a>
  <h1 style="{{st.title}}">New tournament</h1>
  <button onClick="{{toggleTheme}}" aria-label="Switch light or dark theme" style="{{st.iconBtn}}"><span class="ms" aria-hidden="true">{{themeIcon}}</span></button>
</header>

<main style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 8px 16px 16px 16px">
  <section style="display: flex; flex-direction: column; gap: 10px">
    <label style="{{st.field}}">Tournament name<input value="Friday Night Cup" style="{{st.input}}"></label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <label style="{{st.field}}">Date<input value="Fri, 20 Nov · 19:00" style="{{st.input}} font-size: 15px"></label>
      <label style="{{st.field}}">Venue<input value="[Club name]" style="{{st.input}} font-size: 15px"></label>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="{{st.label}}">Format</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{formats}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">
          <span style="display: flex; justify-content: space-between; width: 100%"><span class="ms" aria-hidden="true" style="{{f.iconStyle}}">{{f.icon}}</span><sc-if value="{{f.on}}" hint-placeholder-val="{{ false }}"><span class="ms f" aria-hidden="true" style="{{st.prim}}">check_circle</span></sc-if></span>
          <span style="font-size: 15px; font-weight: 500">{{f.label}}</span>
          <span style="font-size: 12px; line-height: 1.35; {{st.muted}}">{{f.sub}}</span>
        </button>
      </sc-for>
    </div>
    <span style="display: flex; gap: 8px; font-size: 13px; padding: 4px 4px 0 4px; {{st.muted}}"><span class="ms" aria-hidden="true" style="font-size: 18px; {{st.prim}}">info</span>{{formatHelp}}</span>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="{{st.label}}">Match rules</h2>
    <div role="group" aria-label="Match length" style="{{wrap3}}">
      <sc-for list="{{setsOpts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for>
    </div>
    <div role="group" aria-label="Games per set" style="{{wrap3}}">
      <sc-for list="{{gamesOpts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for>
    </div>
    <div role="group" aria-label="Deuce rule" style="{{wrap3}}">
      <sc-for list="{{deuceOpts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button></sc-for>
    </div>
    <div style="{{st.card}} display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Different rules for the final</span><span style="font-size: 12px; {{st.muted}}">e.g. best of 3 with full sets</span></span>
      <button onClick="{{toggleFinal}}" role="switch" aria-checked="{{finalOn}}" aria-label="Different rules for the final" style="{{finalTrack}}"><span style="{{finalKnob}}"></span></button>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="{{st.label}}">Teams</h2>
      <div style="{{st.glass}} display: flex; align-items: center; border-radius: 24px">
        <button onClick="{{dec}}" aria-label="Fewer teams" style="{{st.iconBtn}}"><span class="ms" aria-hidden="true">remove</span></button>
        <span style="{{st.mono}} min-width: 28px; text-align: center; font-size: 16px; font-weight: 600">{{count}}</span>
        <button onClick="{{inc}}" aria-label="More teams" style="{{st.iconBtn}}"><span class="ms" aria-hidden="true">add</span></button>
      </div>
    </div>
    <div style="{{st.card}} display: flex; flex-wrap: wrap; gap: 8px; padding: 14px">
      <sc-for list="{{teams}}" as="tm" hint-placeholder-count="8">
        <span style="{{st.chip}} {{st.glassS}} padding: 0 4px 0 12px; height: 36px"><span style="{{st.mono}} font-size: 11px; {{st.muted}}">{{tm.seed}}</span>{{tm.name}}<button aria-label="{{tm.remove}}" style="{{st.iconBtn}} width: 28px; height: 28px"><span class="ms" aria-hidden="true" style="font-size: 18px">close</span></button></span>
      </sc-for>
      <button style="{{st.chipOn}} height: 36px; cursor: pointer; font-family: inherit"><span class="ms" aria-hidden="true" style="font-size: 18px">person_add</span>Add team</button>
    </div>
    <span style="font-size: 12px; {{st.muted}}">{{teamHelp}}</span>
  </section>
</main>

<footer style="{{st.cardS}} display: flex; gap: 10px; margin: 0 12px 12px 12px; padding: 12px; border-radius: 32px">
  <button aria-label="Shuffle draw" style="{{st.tonal}} width: 56px; padding: 0; flex: none"><span class="ms" aria-hidden="true">shuffle</span></button>
  <a href="{{L.Tournament}}" style="{{st.filled}} flex: 1"><span class="ms" aria-hidden="true">casino</span>Create &amp; make draw</a>
</footer>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
var PAL = {
  dark: {
    bg: '#070B16', blobA: '#0D9488', blobB: '#4F46E5', blobC: '#B45309',
    glass: 'rgba(255,255,255,0.07)', glassStrong: 'rgba(255,255,255,0.13)', stroke: 'rgba(255,255,255,0.16)',
    text: '#EEF2F8', muted: '#AAB4C5', primary: '#5EEAD4', onPrimary: '#00382F',
    primarySoft: 'rgba(94,234,212,0.18)', glow: 'rgba(45,212,191,0.35)', live: '#FCA5A5',
    win: '#86EFAC', loss: '#FCA5A5', scrim: 'rgba(7,11,22,0.35)'
  },
  light: {
    bg: '#E8EEF6', blobA: '#5EEAD4', blobB: '#A5B4FC', blobC: '#FCD34D',
    glass: 'rgba(255,255,255,0.52)', glassStrong: 'rgba(255,255,255,0.78)', stroke: 'rgba(255,255,255,0.9)',
    text: '#0B1324', muted: '#46546A', primary: '#0F766E', onPrimary: '#FFFFFF',
    primarySoft: 'rgba(15,118,110,0.13)', glow: 'rgba(15,118,110,0.28)', live: '#B42318',
    win: '#067647', loss: '#B42318', scrim: 'rgba(255,255,255,0.3)'
  }
};
function theme(self) {
  var mode = self.state.mode || self.props.theme || 'dark';
  var c = PAL[mode];
  var blur = 'backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);';
  var glass = 'background:' + c.glass + ';' + blur + 'border:1px solid ' + c.stroke + ';box-sizing:border-box;';
  var glassS = 'background:' + c.glassStrong + ';' + blur + 'border:1px solid ' + c.stroke + ';box-sizing:border-box;';
  var lightPrefix = self.props.theme === 'light' ? 'Light' : '';
  var link = function (n) { return lightPrefix + n + '.dc.html'; };
  var st = {
    root: 'position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;font-family:Roboto,system-ui,sans-serif;color:' + c.text + ';background:' + c.bg + ';',
    rootL: 'position:relative;width:844px;height:390px;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;font-family:Roboto,system-ui,sans-serif;color:' + c.text + ';background:' + c.bg + ';',
    blobA: 'position:absolute;width:380px;height:380px;border-radius:50%;top:-140px;left:-150px;background:' + c.blobA + ';opacity:0.55;filter:blur(70px);',
    blobB: 'position:absolute;width:360px;height:360px;border-radius:50%;bottom:60px;right:-190px;background:' + c.blobB + ';opacity:0.55;filter:blur(80px);',
    blobC: 'position:absolute;width:200px;height:200px;border-radius:50%;top:380px;left:-60px;background:' + c.blobC + ';opacity:0.22;filter:blur(70px);',
    glass: glass, glassS: glassS,
    card: glass + 'border-radius:24px;',
    cardS: glassS + 'border-radius:24px;',
    bar: 'display:flex;align-items:center;gap:4px;padding:12px 8px 8px 8px;',
    title: 'flex:1;margin:0;font-size:22px;font-weight:400;min-width:0;',
    iconBtn: 'width:48px;height:48px;flex:none;border-radius:24px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:' + c.text + ';cursor:pointer;text-decoration:none;padding:0;',
    iconBtnG: glass + 'width:48px;height:48px;flex:none;border-radius:24px;display:flex;align-items:center;justify-content:center;color:' + c.text + ';cursor:pointer;text-decoration:none;padding:0;',
    filled: 'display:flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px;border-radius:28px;border:none;background:' + c.primary + ';color:' + c.onPrimary + ';font-family:inherit;font-size:16px;font-weight:500;text-decoration:none;cursor:pointer;box-shadow:0 10px 28px ' + c.glow + ';box-sizing:border-box;',
    tonal: glassS + 'display:flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 20px;border-radius:28px;color:' + c.text + ';font-family:inherit;font-size:16px;font-weight:500;text-decoration:none;cursor:pointer;',
    label: 'margin:0;font-size:14px;font-weight:500;color:' + c.muted + ';letter-spacing:0.01em;',
    muted: 'color:' + c.muted + ';',
    prim: 'color:' + c.primary + ';',
    mono: "font-family:'Roboto Mono',monospace;",
    chip: glass + 'display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:' + c.text + ';',
    chipOn: 'display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;box-sizing:border-box;background:' + c.primarySoft + ';border:1px solid ' + c.primary + ';color:' + c.text + ';',
    badgeLive: 'display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:' + c.live + ';',
    dotLive: 'width:8px;height:8px;border-radius:4px;background:' + c.live + ';box-shadow:0 0 10px ' + c.live + ';',
    divider: 'height:1px;background:' + c.stroke + ';',
    field: glassS + 'display:flex;flex-direction:column;gap:2px;padding:8px 16px;border-radius:16px;font-size:12px;color:' + c.muted + ';',
    input: 'border:none;outline-offset:4px;background:transparent;padding:0;height:24px;font-family:inherit;font-size:16px;color:' + c.text + ';',
    nav: glassS + 'display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 12px 12px 12px;border-radius:32px;padding:10px 4px;',
    navItem: 'display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;font-size:12px;font-weight:500;color:' + c.muted + ';',
    navItemOn: 'display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;font-size:12px;font-weight:700;color:' + c.text + ';',
    pill: 'display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px;',
    pillOn: 'display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px;background:' + c.primarySoft + ';color:' + c.primary + ';',
    track: 'height:4px;border-radius:2px;background:' + c.glassStrong + ';overflow:hidden;',
    trackFill: 'height:4px;border-radius:2px;background:' + c.primary + ';'
  };
  st.segWrap = function (n) { return glass + 'display:grid;grid-template-columns:repeat(' + n + ',minmax(0,1fr));border-radius:20px;overflow:hidden;'; };
  st.seg = function (on, first) {
    return 'display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 6px;border:none;' + (first ? '' : 'border-left:1px solid ' + c.stroke + ';') +
      'font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;' + (on ? 'background:' + c.primarySoft + ';color:' + c.primary + ';' : 'background:transparent;color:' + c.text + ';');
  };
  return {
    mode: mode, c: c, st: st, link: link,
    base: {
      st: st, c: c,
      toggleTheme: function () { self.setState({ mode: mode === 'dark' ? 'light' : 'dark' }); },
      themeIcon: mode === 'dark' ? 'light_mode' : 'dark_mode',
      L: {
        Main: link('Main'), NewMatch: link('NewMatch'), LiveScore: link('LiveScore'),
        TournamentCreate: link('TournamentCreate'), Tournament: link('Tournament'),
        Bracket: link('Bracket'), TournamentResults: link('TournamentResults'),
        Welcome: link('Welcome'), Settings: link('Settings'), Courtside: link('Courtside'), ResultCard: link('ResultCard'),
        PlayerProfile: link('PlayerProfile'), HeadToHead: link('HeadToHead'), Americano: link('Americano'), Courts: link('Courts'),
        RankingRules: link('RankingRules'), ShareLive: link('ShareLive')
      }
    }
  };
}
function segs(self, t, key, list) {
  return list.map(function (o, i) {
    var on = self.state[key] === o.v;
    return {
      label: o.label, on: on, pressed: on ? 'true' : 'false',
      pick: function () { var s = {}; s[key] = o.v; self.setState(s); },
      style: t.st.seg(on, i === 0)
    };
  });
}
function sw(t, on) {
  var c = t.c;
  return {
    on: on ? 'true' : 'false',
    track: 'position:relative;flex:none;width:52px;height:32px;border-radius:16px;cursor:pointer;padding:0;box-sizing:border-box;border:2px solid ' + (on ? c.primary + ';background:' + c.primary : c.muted + ';background:transparent'),
    knob: 'position:absolute;border-radius:50%;' + (on ? 'top:2px;left:22px;width:24px;height:24px;background:' + c.onPrimary : 'top:6px;left:6px;width:16px;height:16px;background:' + c.muted)
  };
}

var NAMES = ['Omar & Karim', 'Hassan & Tarek', 'Youssef & Ali', 'Nour & Sara', 'Mona & Laila', 'Ziad & Amr', 'Adam & Hana', 'Seif & Malak',
  'Rana & Dina', 'Khaled & Fady', 'Mostafa & Habiba', 'Yara & Salma', 'Omar & Nour', 'Tamer & Hany', 'Malik & Jana', 'Bassem & Reem'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: null, format: 'groups', sets: 3, games: 6, deuce: 'golden', finalRules: true, count: 16 };
  }
  renderVals() {
    var t = theme(this), c = t.c, s = this.state, self = this;
    var F = [
      { v: 'rr', icon: 'table_chart', label: 'Round robin', sub: 'Everyone plays everyone' },
      { v: 'groups', icon: 'account_tree', label: 'Groups + knockout', sub: 'Group stage, then playoffs' },
      { v: 'ko', icon: 'trophy', label: 'Knockout', sub: 'Lose once and you are out' },
      { v: 'americano', icon: 'shuffle', label: 'Americano', sub: 'Rotating partners, points tally' }
    ];
    var formats = F.map(function (f) {
      var on = s.format === f.v;
      return {
        icon: f.icon, label: f.label, sub: f.sub, on: on, pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ format: f.v }); },
        iconStyle: 'color:' + (on ? c.primary : c.muted),
        style: (on ? 'background:' + c.primarySoft + ';border:2px solid ' + c.primary + ';' : t.st.glass + 'margin:1px;') +
          'backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:20px;text-align:left;cursor:pointer;font-family:inherit;color:' + c.text + ';box-sizing:border-box;'
      };
    });
    var n = s.count;
    var help = {
      rr: n + ' teams · ' + (n * (n - 1) / 2) + ' matches · table decides the winner',
      groups: Math.max(1, Math.floor(n / 4)) + ' groups of 4 · top 2 advance · ' + (Math.floor(n / 4) * 6 + Math.max(1, Math.floor(n / 4)) * 2 - 1) + ' matches',
      ko: n + ' teams · ' + (n - 1) + ' matches · byes added if needed',
      americano: 'Players swap partners each round · first to 24 points per match'
    }[s.format];
    var teams = NAMES.slice(0, n).map(function (nm, i) { return { seed: String(i + 1), name: nm, remove: 'Remove ' + nm }; });
    return Object.assign({}, t.base, {
      formats: formats, formatHelp: help,
      wrap3: t.st.segWrap(3),
      setsOpts: segs(this, t, 'sets', [{ v: 1, label: '1 set' }, { v: 3, label: 'Best of 3' }, { v: 5, label: 'Best of 5' }]),
      gamesOpts: segs(this, t, 'games', [{ v: 4, label: 'Sets to 4' }, { v: 6, label: 'Sets to 6' }, { v: 9, label: 'Pro set 9' }]),
      deuceOpts: segs(this, t, 'deuce', [{ v: 'adv', label: 'Advantage' }, { v: 'golden', label: 'Golden' }, { v: 'star', label: 'Star point' }]),
      finalOn: s.finalRules ? 'true' : 'false',
      toggleFinal: function () { self.setState({ finalRules: !s.finalRules }); },
      finalTrack: 'position:relative;flex:none;width:52px;height:32px;border-radius:16px;cursor:pointer;padding:0;box-sizing:border-box;border:2px solid ' + (s.finalRules ? c.primary + ';background:' + c.primary : c.muted + ';background:transparent'),
      finalKnob: 'position:absolute;border-radius:50%;' + (s.finalRules ? 'top:2px;left:22px;width:24px;height:24px;background:' + c.onPrimary : 'top:6px;left:6px;width:16px;height:16px;background:' + c.muted),
      count: n, teams: teams,
      dec: function () { self.setState({ count: Math.max(4, s.count - 1) }); },
      inc: function () { self.setState({ count: Math.min(16, s.count + 1) }); },
      teamHelp: 'Drag to reorder seeds. Seeds 1–4 are kept apart in the draw.'
    });
  }
}

</script>
</body>
</html>
